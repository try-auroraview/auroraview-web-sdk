name: OIDC Diagnostics

# Temporary: prints the exact OIDC claims npm validates for trusted publishing.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    name: Claims
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Decode OIDC claims
        run: |
          token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=registry.npmjs.org" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          TOKEN="$token" python3 - <<'PY'
          import base64, json, os
          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({k: claims.get(k) for k in (
              "aud", "iss", "sub", "repository", "repository_owner",
              "job_workflow_ref", "workflow_ref", "workflow",
              "environment", "event_name", "ref", "ref_type",
          )}, indent=2))
          PY
