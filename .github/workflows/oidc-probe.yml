name: OIDC Probe

# Temporary read-only probe: asks npm who the OIDC token is, with and without
# the `npm` environment, to find which trusted-publisher entry is registered.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  with-environment:
    name: Probe with environment npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/oidc_probe.sh "with environment npm"

  without-environment:
    name: Probe without environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/oidc_probe.sh "without environment"
